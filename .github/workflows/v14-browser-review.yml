name: V14 Real Browser Preview Review
on:
  push:
    branches: ["preview/andrew-v14-editorial-technical"]
    paths:
      - "index.html"
      - "ar.html"
      - "v14.css"
      - "v11.js"
      - "v12-work.js"
      - "tools/v14-browser-review.mjs"
      - ".github/workflows/v14-browser-review.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install headless browser only for QA (no production dependencies)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check typography, assets, dialog flows, mobile and RTL
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/andrew-preview-http.log 2>&1 &
          sleep 2
          node tools/v14-browser-review.mjs
      - name: Save four bilingual desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andrew-v14-bilingual-review-screenshots
          path: v14-review-screenshots/
          if-no-files-found: warn
          retention-days: 14
